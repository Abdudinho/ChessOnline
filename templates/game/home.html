<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #312e2b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #fff;
        }
        .navbar {
            background: #262421;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #3d3a37;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #81b64c, #5d9948);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .hero {
            text-align: center;
            max-width: 520px;
        }
        .hero h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff 0%, #cfcfcf 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            color: #a0a0a0;
            font-size: 17px;
            margin-bottom: 36px;
            line-height: 1.5;
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #81b64c, #5d9948);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            padding: 16px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(129, 182, 76, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(129, 182, 76, 0.45);
        }
        .features {
            display: flex;
            gap: 24px;
            margin-top: 50px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .feature {
            background: #262421;
            border: 1px solid #3d3a37;
            border-radius: 12px;
            padding: 20px 24px;
            width: 160px;
            text-align: center;
        }
        .feature-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .feature h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .feature p {
            font-size: 12px;
            color: #888;
            margin: 0;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/game/static" class="logo">
            <div class="logo-icon">♟</div>
            Chess Online
        </a>
    </nav>

    <div class="main">
        <div class="hero">
            <h1>Online Chess</h1>
            <p>Do‘stingiz bilan real-time shaxmat o‘ynang.<br>Tez, oddiy va chiroyli interfeys.</p>
            <a href="{% url 'create_game' %}" class="btn-primary">
                <span>♟</span> Yangi o‘yin yaratish
            </a>

            <div class="features">
                <div class="feature">
                    <div class="feature-icon">⚡</div>
                    <h3>Real-time</h3>
                    <p>WebSocket orqali</p>
                </div>
                <div class="feature">
                    <div class="feature-icon">♟</div>
                    <h3>To‘liq qoidalar</h3>
                    <p>python-chess</p>
                </div>
                <div class="feature">
                    <div class="feature-icon">🔗</div>
                    <h3>Link orqali</h3>
                    <p>Do‘stingizni taklif qiling</p>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        Django + Channels + WebSocket
    </div>
</body>
</html>
